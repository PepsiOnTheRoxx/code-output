<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Boek toevoegen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('catalogusfrontend.index') }}">Catalogus</a>
    </div>
</nav>
<div class="container mt-4">
    <h2>Nieuw boek toevoegen</h2>
    <form method="post">
        <div class="mb-3">
            <label for="titel" class="form-label">Titel</label>
            <input type="text" class="form-control" id="titel" name="titel" required>
        </div>
        <div class="mb-3">
            <label for="auteur" class="form-label">Auteur</label>
            <input type="text" class="form-control" id="auteur" name="auteur" required>
        </div>
        <div class="mb-3">
            <label for="kaft_url" class="form-label">URL van kaftfoto</label>
            <input type="url" class="form-control" id="kaft_url" name="kaft_url">
        </div>
        <div class="mb-3">
            <label for="status" class="form-label">Uitleenstatus</label>
            <select class="form-select" id="status" name="status">
                <option value="Beschikbaar">Beschikbaar</option>
                <option value="Uitgeleend">Uitgeleend</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Opslaan</button>
        <a href="{{ url_for('catalogusfrontend.index') }}" class="btn btn-secondary">Annuleren</a>
    </form>
</div>
</body>
</html>
