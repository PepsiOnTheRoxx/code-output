<!DOCTYPE html>
<html>
<head>
    <title>{{ boek.titel }} - Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <a href="{{ url_for('catalogusfrontend.index') }}" class="btn btn-link">&laquo; Terug naar catalogus</a>
    <div class="card mb-3">
        <div class="row g-0">
            <div class="col-md-4">
                <img src="{{ boek.kaft_url }}" class="img-fluid rounded-start" alt="Kaft van {{ boek.titel }}">
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <h2 class="card-title">{{ boek.titel }}</h2>
                    <h5 class="card-subtitle mb-2 text-muted">Auteur: {{ boek.auteur }}</h5>
                    <p class="card-text">
                        Status: <span class="badge bg-{{ 'success' if boek.status == 'Beschikbaar' else 'danger' }}">{{ boek.status }}</span>
                    </p>
                    <a href="{{ url_for('catalogusfrontend.aanpassen', boek_id=boek.id) }}" class="btn btn-warning">Aanpassen</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
