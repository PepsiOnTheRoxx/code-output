<!DOCTYPE html>
<html>
<head>
    <title>Boek Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>{{ boek.titel }}</h1>
    <div class="row">
        <div class="col-md-3">
            {% if boek.kaft_url %}
                <img src="{{ boek.kaft_url }}" alt="Kaft" class="img-fluid mb-3">
            {% endif %}
        </div>
        <div class="col-md-9">
            <ul class="list-group">
                <li class="list-group-item"><strong>Auteur:</strong> {{ boek.auteur }}</li>
                <li class="list-group-item"><strong>Uitgever:</strong> {{ boek.uitgever }}</li>
                <li class="list-group-item"><strong>Publicatiejaar:</strong> {{ boek.publicatiejaar }}</li>
            </ul>
            <a href="{{ url_for('boektoevoegenfrontend.catalogus') }}" class="btn btn-secondary mt-3">Terug naar catalogus</a>
            <a href="{{ url_for('boektoevoegenfrontend.boek_aanpassen', boek_id=boek.id) }}" class="btn btn-warning mt-3 ms-2">Aanpassen</a>
        </div>
    </div>
</div>
</body>
</html>
