<!DOCTYPE html>
<html>
<head>
    <title>Boek Aanpassen</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1>Boek aanpassen</h1>
    <form method="post">
        <div class="mb-3">
            <label for="titel" class="form-label">Titel</label>
            <input type="text" class="form-control" id="titel" name="titel" required value="{{ boek.titel }}">
        </div>
        <div class="mb-3">
            <label for="auteur" class="form-label">Auteur</label>
            <input type="text" class="form-control" id="auteur" name="auteur" required value="{{ boek.auteur }}">
        </div>
        <div class="mb-3">
            <label for="uitgever" class="form-label">Uitgever</label>
            <input type="text" class="form-control" id="uitgever" name="uitgever" value="{{ boek.uitgever }}">
        </div>
        <div class="mb-3">
            <label for="publicatiejaar" class="form-label">Publicatiejaar</label>
            <input type="number" class="form-control" id="publicatiejaar" name="publicatiejaar" value="{{ boek.publicatiejaar }}">
        </div>
        <div class="mb-3">
            <label for="kaft_url" class="form-label">Kaft foto URL</label>
            <input type="url" class="form-control" id="kaft_url" name="kaft_url" value="{{ boek.kaft_url }}">
        </div>
        <button type="submit" class="btn btn-primary">Opslaan</button>
        <a href="{{ url_for('boektoevoegenfrontend.catalogus') }}" class="btn btn-secondary ms-2">Annuleren</a>
    </form>
</div>
</body>
</html>
