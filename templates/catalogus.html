<!DOCTYPE html>
<html>
<head>
    <title>Catalogus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Boekencatalogus</h1>
    <a href="{{ url_for('boektoevoegenfrontend.boek_toevoegen') }}" class="btn btn-primary mb-3">Boek toevoegen</a>
    <table class="table">
        <thead>
            <tr>
                <th>Kaft</th>
                <th>Titel</th>
                <th>Auteur</th>
                <th>Uitgever</th>
                <th>Jaar</th>
                <th>Acties</th>
            </tr>
        </thead>
        <tbody>
            {% for boek in boeken %}
            <tr>
                <td>{% if boek.kaft_url %}<img src="{{ boek.kaft_url }}" alt="Kaft" style="height: 60px;">{% endif %}</td>
                <td>{{ boek.titel }}</td>
                <td>{{ boek.auteur }}</td>
                <td>{{ boek.uitgever }}</td>
                <td>{{ boek.publicatiejaar }}</td>
                <td>
                    <a href="{{ url_for('boektoevoegenfrontend.boek_detail', boek_id=boek.id) }}" class="btn btn-sm btn-info">Detail</a>
                    <a href="{{ url_for('boektoevoegenfrontend.boek_aanpassen', boek_id=boek.id) }}" class="btn btn-sm btn-warning">Aanpassen</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
