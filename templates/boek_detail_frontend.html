<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Boek Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <nav>
        <a href="{{ url_for('catalogusfrontend.catalogus_frontend') }}" class="btn btn-secondary mb-3">&larr; Terug naar catalogus</a>
    </nav>
    <h2>Details van het boek</h2>
    <ul class="list-group mb-3">
        <li class="list-group-item"><strong>Titel:</strong> {{ boek.titel }}</li>
        <li class="list-group-item"><strong>Auteur:</strong> {{ boek.auteur }}</li>
    </ul>
    <a href="{{ url_for('catalogusfrontend.boek_aanpassen_frontend', boek_id=boek.id) }}" class="btn btn-warning">Aanpassen</a>
</div>
</body>
</html>
