<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Boekdetail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('catalogusfrontend.index') }}">Catalogus</a>
        <a class="btn btn-primary" href="{{ url_for('catalogusfrontend.boek_toevoegen') }}">Boek toevoegen</a>
    </div>
</nav>
<div class="container mt-4">
    <div class="card mb-3 mx-auto" style="max-width: 540px;">
      <div class="row g-0">
        <div class="col-md-4">
          <img src="{{ boek.kaft_url or 'https://via.placeholder.com/150x220?text=Geen+Afbeelding' }}" class="img-fluid rounded-start" alt="Kaft van {{ boek.titel }}">
        </div>
        <div class="col-md-8">
          <div class="card-body">
            <h5 class="card-title">{{ boek.titel }}</h5>
            <p class="card-text"><strong>Auteur:</strong> {{ boek.auteur }}</p>
            <p class="card-text"><strong>Status:</strong> <span class="badge {% if boek.status == 'Uitgeleend' %}bg-danger{% else %}bg-success{% endif %}">{{ boek.status }}</span></p>
            <a href="{{ url_for('catalogusfrontend.boek_aanpassen', boek_id=boek.id) }}" class="btn btn-warning btn-sm">Aanpassen</a>
            <a href="{{ url_for('catalogusfrontend.index') }}" class="btn btn-secondary btn-sm">Terug naar overzicht</a>
          </div>
        </div>
      </div>
    </div>
</div>
</body>
</html>
