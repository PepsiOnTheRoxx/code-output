<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boek Aanpassen</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('catalogusfrontend.catalogus_frontend') }}">Catalogus</a>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>Boek aanpassen</h1>
        <form method="post">
            <div class="mb-3">
                <label for="titel" class="form-label">Titel</label>
                <input type="text" name="titel" id="titel" class="form-control" value="{{ boek.titel }}" required>
            </div>
            <div class="mb-3">
                <label for="auteur" class="form-label">Auteur</label>
                <input type="text" name="auteur" id="auteur" class="form-control" value="{{ boek.auteur }}" required>
            </div>
            <div class="mb-3">
                <label for="kaft_url" class="form-label">Kaft afbeelding URL</label>
                <input type="url" name="kaft_url" id="kaft_url" class="form-control" value="{{ boek.kaft_url }}">
            </div>
            <div class="mb-3">
                <label for="status" class="form-label">Status</label>
                <select name="status" id="status" class="form-select" required>
                    <option value="beschikbaar" {% if boek.status == 'beschikbaar' %}selected{% endif %}>Beschikbaar</option>
                    <option value="uitgeleend" {% if boek.status == 'uitgeleend' %}selected{% endif %}>Uitgeleend</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Opslaan</button>
            <a href="{{ url_for('catalogusfrontend.boek_detail_frontend', boek_id=boek.id) }}" class="btn btn-secondary ms-2">Annuleren</a>
        </form>
    </div>
</body>
</html>
