<!DOCTYPE html>
<html>
<head>
    <title>Boek aanpassen</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Boek aanpassen</h1>
    <form method="post">
        <div class="mb-3">
            <label for="titel" class="form-label">Titel</label>
            <input type="text" class="form-control" id="titel" name="titel" value="{{ boek.titel }}" required>
        </div>
        <div class="mb-3">
            <label for="auteur" class="form-label">Auteur</label>
            <input type="text" class="form-control" id="auteur" name="auteur" value="{{ boek.auteur }}" required>
        </div>
        <div class="mb-3">
            <label for="jaar" class="form-label">Jaar</label>
            <input type="number" class="form-control" id="jaar" name="jaar" value="{{ boek.jaar }}">
        </div>
        <div class="mb-3">
            <label for="uitgever" class="form-label">Uitgever</label>
            <input type="text" class="form-control" id="uitgever" name="uitgever" value="{{ boek.uitgever }}">
        </div>
        <div class="mb-3">
            <label for="uitleen_status" class="form-label">Uitleen status</label>
            <select class="form-select" id="uitleen_status" name="uitleen_status">
                <option value="beschikbaar" {% if boek.uitleen_status == 'beschikbaar' %}selected{% endif %}>Beschikbaar</option>
                <option value="uitgeleend" {% if boek.uitleen_status == 'uitgeleend' %}selected{% endif %}>Uitgeleend</option>
                <option value="gereserveerd" {% if boek.uitleen_status == 'gereserveerd' %}selected{% endif %}>Gereserveerd</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Opslaan</button>
        <a href="{{ url_for('boekaanpassenfrontend.detail', boek_id=boek.id) }}" class="btn btn-secondary">Annuleren</a>
    </form>
</div>
</body>
</html>
