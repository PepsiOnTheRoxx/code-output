<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Boek Aanpassen</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <nav>
        <a href="{{ url_for('catalogusfrontend.catalogus_frontend') }}" class="btn btn-secondary mb-3">&larr; Terug naar catalogus</a>
        <a href="{{ url_for('catalogusfrontend.boek_detail_frontend', boek_id=boek.id) }}" class="btn btn-primary mb-3">&larr; Terug naar detail</a>
    </nav>
    <h2>Boek aanpassen</h2>
    <form method="post" class="mt-3">
        <div class="mb-3">
            <label for="titel" class="form-label">Titel</label>
            <input type="text" class="form-control" id="titel" name="titel" value="{{ boek.titel }}" required>
        </div>
        <div class="mb-3">
            <label for="auteur" class="form-label">Auteur</label>
            <input type="text" class="form-control" id="auteur" name="auteur" value="{{ boek.auteur }}" required>
        </div>
        <button type="submit" class="btn btn-success">Opslaan</button>
    </form>
</div>
</body>
</html>
