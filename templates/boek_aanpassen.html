<!DOCTYPE html>
<html>
<head>
    <title>Boek aanpassen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <nav class="mb-3">
        <a href="{{ url_for('catalogusfrontend.index') }}" class="btn btn-secondary">Terug naar catalogus</a>
        <a href="{{ url_for('boekdetailfrontend.detail', boek_id=boek.id) }}" class="btn btn-outline-primary ms-2">Naar detailpagina</a>
    </nav>
    <h1>Boek aanpassen</h1>
    <form method="POST">
        <div class="mb-3">
            <label for="titel" class="form-label">Titel</label>
            <input type="text" id="titel" name="titel" value="{{ boek.titel }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="auteur" class="form-label">Auteur</label>
            <input type="text" id="auteur" name="auteur" value="{{ boek.auteur }}" class="form-control" required>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="uitgeleend" id="uitgeleend" {% if boek.uitgeleend %}checked{% endif %}>
            <label class="form-check-label" for="uitgeleend">Uitgeleend</label>
        </div>
        <button type="submit" class="btn btn-primary">Opslaan</button>
    </form>
</div>
</body>
</html>
