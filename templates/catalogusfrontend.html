<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalogus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('catalogusfrontend.catalogus_frontend') }}">Catalogus</a>
            <div>
                <a href="{{ url_for('catalogusfrontend.boek_toevoegen_frontend') }}" class="btn btn-light">Boek toevoegen</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>Boekencatalogus</h1>
        <div class="row">
            {% for boek in boeken %}
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm">
                    {% if boek.kaft_url %}
                    <img src="{{ boek.kaft_url }}" class="card-img-top" alt="Kaft van {{ boek.titel }}">
                    {% else %}
                    <svg class="card-img-top" style="height:220px;background:#eee;" xmlns="http://www.w3.org/2000/svg">
                        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#888" font-size="22">Geen Afbeelding</text>
                    </svg>
                    {% endif %}
                    <div class="card-body">
                        <h5 class="card-title">{{ boek.titel }}</h5>
                        <p class="card-text">Auteur: {{ boek.auteur }}</p>
                        <p><span class="badge {% if boek.status == 'uitgeleend' %}bg-danger{% elif boek.status == 'beschikbaar' %}bg-success{% else %}bg-secondary{% endif %}">{{ boek.status|capitalize }}</span></p>
                        <a href="{{ url_for('catalogusfrontend.boek_detail_frontend', boek_id=boek.id) }}" class="btn btn-outline-primary btn-sm">Details</a>
                        <a href="{{ url_for('catalogusfrontend.boek_aanpassen_frontend', boek_id=boek.id) }}" class="btn btn-outline-warning btn-sm">Aanpassen</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
