<!DOCTYPE html>
<html>
<head>
    <title>Boek detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>{{ boek.titel }}</h1>
    <div class="row mt-4">
        <div class="col-md-4">
            {% if boek.kaft_foto_url %}
            <img src="{{ boek.kaft_foto_url }}" class="img-fluid" alt="Kaft van {{ boek.titel }}">
            {% else %}
            <img src="https://via.placeholder.com/200x300?text=Geen+kaft" class="img-fluid" alt="Geen kaft">
            {% endif %}
        </div>
        <div class="col-md-8">
            <ul class="list-group">
                <li class="list-group-item"><b>Auteur:</b> {{ boek.auteur }}</li>
                <li class="list-group-item"><b>Jaar:</b> {{ boek.jaar }}</li>
                <li class="list-group-item"><b>Uitgever:</b> {{ boek.uitgever }}</li>
            </ul>
            <div class="mt-3">
                <a href="{{ url_for('boektoevoegenfrontend.catalogus') }}" class="btn btn-primary me-2">Terug naar catalogus</a>
                <a href="{{ url_for('boektoevoegenfrontend.boek_aanpassen', boek_id=boek.id) }}" class="btn btn-warning">Aanpassen</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
