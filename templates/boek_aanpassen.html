<!DOCTYPE html>
<html>
<head>
    <title>Boek aanpassen</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <nav class="mb-3">
        <a href="{{ url_for('catalogusfrontend.index') }}" class="btn btn-secondary me-2">&laquo; Terug naar catalogus</a>
        <a href="{{ url_for('boekdetailfrontend.detail', boek_id=boek.id) }}" class="btn btn-outline-secondary">Naar detail</a>
    </nav>
    <h1>Boek aanpassen</h1>
    <form method="POST">
        <div class="mb-3">
            <label for="titel" class="form-label">Titel</label>
            <input type="text" class="form-control" id="titel" name="titel" required value="{{ boek.titel }}">
        </div>
        <div class="mb-3">
            <label for="auteur" class="form-label">Auteur</label>
            <input type="text" class="form-control" id="auteur" name="auteur" required value="{{ boek.auteur }}">
        </div>
        <div class="mb-3">
            <label for="genre" class="form-label">Genre</label>
            <input type="text" class="form-control" id="genre" name="genre" value="{{ boek.genre }}">
        </div>
        <div class="mb-3">
            <label for="jaar" class="form-label">Jaar</label>
            <input type="number" class="form-control" id="jaar" name="jaar" value="{{ boek.jaar }}">
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="uitgeleend" name="uitgeleend" {% if boek.uitgeleend %}checked{% endif %}>
            <label class="form-check-label" for="uitgeleend">Uitgeleend?</label>
        </div>
        <button type="submit" class="btn btn-primary">Opslaan</button>
        <a href="{{ url_for('boekdetailfrontend.detail', boek_id=boek.id) }}" class="btn btn-link">Annuleren</a>
    </form>
</div>
</body>
</html>
