<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Boek toevoegen</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <nav class="mb-4">
        <a href="{{ url_for('catalogusfrontend.catalogus_overzicht') }}" class="btn btn-link">&#8592; Terug naar overzicht</a>
    </nav>
    <h1>Nieuw boek toevoegen</h1>
    <form method="post">
        <div class="mb-3">
            <label class="form-label">Auteur</label>
            <input type="text" name="auteur" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Kaft foto URL</label>
            <input type="url" name="kaft_foto_url" class="form-control" required>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="is_uitgeleend" id="is_uitgeleend">
            <label class="form-check-label" for="is_uitgeleend">Is uitgeleend</label>
        </div>
        <button type="submit" class="btn btn-primary">Toevoegen</button>
    </form>
</div>
</body>
</html>
