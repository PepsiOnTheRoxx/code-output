<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Boek aanpassen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="mb-3">
        <a href="{{ url_for('catalogusfrontend.catalogus') }}" class="btn btn-secondary">&laquo; Terug naar catalogus</a>
        <a href="{{ url_for('boekdetailfrontend.detail', boek_id=boek['rowid'] if 'rowid' in boek.keys() else boek['id']) }}" class="btn btn-link">Detailpagina</a>
    </div>
    <h1>Boek aanpassen</h1>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Auteur</label>
            <input type="text" class="form-control" name="auteur" required value="{{ boek['auteur'] }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Beschrijving</label>
            <textarea class="form-control" name="beschrijving" rows="3">{{ boek['beschrijving'] }}</textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">ISBN</label>
            <input type="text" class="form-control" name="isbn" value="{{ boek['isbn'] }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Publicatiedatum</label>
            <input type="date" class="form-control" name="publicatiedatum" value="{{ boek['publicatiedatum'] }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Kaft foto URL</label>
            <input type="text" class="form-control" name="kaft_foto_url" value="{{ boek['kaft_foto_url'] }}">
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="is_uitgeleend" name="is_uitgeleend" {% if boek['is_uitgeleend'] %}checked{% endif %}>
            <label class="form-check-label" for="is_uitgeleend">Is uitgeleend?</label>
        </div>
        <div class="mb-3">
            <label class="form-label">Uitgeleend datum</label>
            <input type="date" class="form-control" name="uitgeleend_datum" value="{{ boek['uitgeleend_datum'] }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Uitgeleend max tot</label>
            <input type="date" class="form-control" name="uitgeleend_max_tot" value="{{ boek['uitgeleend_max_tot'] }}">
        </div>
        <button type="submit" class="btn btn-primary">Opslaan</button>
        <a href="{{ url_for('boekdetailfrontend.detail', boek_id=boek['rowid'] if 'rowid' in boek.keys() else boek['id']) }}" class="btn btn-outline-secondary ms-2">Annuleren</a>
    </form>
</div>
</body>
</html>
