<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boek aanpassen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
  <nav class="mb-3">
    <a href="{{ url_for('boekaanpassenfrontend.index') }}" class="btn btn-secondary">&laquo; Terug naar catalogus</a>
    <a href="{{ url_for('boekaanpassenfrontend.detail', boek_id=boek.id) }}" class="btn btn-outline-info ms-2">Bekijk detail</a>
  </nav>
  <h2>Boek bewerken</h2>
  <form method="post">
    <div class="mb-3">
      <label for="auteur" class="form-label">Auteur</label>
      <input type="text" class="form-control" id="auteur" name="auteur" required value="{{ boek.auteur }}">
    </div>
    <div class="mb-3">
      <label for="beschrijving" class="form-label">Beschrijving</label>
      <textarea class="form-control" id="beschrijving" name="beschrijving" rows="4" required>{{ boek.beschrijving }}</textarea>
    </div>
    <div class="mb-3">
      <label for="isbn" class="form-label">ISBN</label>
      <input type="text" class="form-control" id="isbn" name="isbn" value="{{ boek.isbn }}">
    </div>
    <div class="mb-3">
      <label for="publicatiedatum" class="form-label">Publicatiedatum</label>
      <input type="date" class="form-control" id="publicatiedatum" name="publicatiedatum" value="{{ boek.publicatiedatum }}">
    </div>
    <div class="mb-3">
      <label for="kaft_foto_url" class="form-label">Kaft foto URL</label>
      <input type="text" class="form-control" id="kaft_foto_url" name="kaft_foto_url" value="{{ boek.kaft_foto_url }}">
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="is_uitgeleend" name="is_uitgeleend" {% if boek.is_uitgeleend %}checked{% endif %}>
      <label class="form-check-label" for="is_uitgeleend">Is uitgeleend</label>
    </div>
    <div class="mb-3">
      <label for="uitgeleend_datum" class="form-label">Uitgeleend op</label>
      <input type="date" class="form-control" id="uitgeleend_datum" name="uitgeleend_datum" value="{{ boek.uitgeleend_datum }}">
    </div>
    <div class="mb-3">
      <label for="uitgeleend_max_tot" class="form-label">Uitgeleend maximaal tot</label>
      <input type="date" class="form-control" id="uitgeleend_max_tot" name="uitgeleend_max_tot" value="{{ boek.uitgeleend_max_tot }}">
    </div>
    <button class="btn btn-primary">Opslaan</button>
    <a href="{{ url_for('boekaanpassenfrontend.detail', boek_id=boek.id) }}" class="btn btn-outline-secondary ms-2">Annuleren</a>
  </form>
</div>
</body>
</html>
