<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Boek aanpassen: {{ boek.titel }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('catalogusfrontend.catalogus') }}">Boekencatalogus</a>
  </div>
</nav>
<div class="container">
  <h1>Boek aanpassen</h1>
  <form method="POST">
    <div class="mb-3">
      <label for="titel" class="form-label">Titel</label>
      <input type="text" class="form-control" id="titel" name="titel" value="{{ boek.titel }}" required>
    </div>
    <div class="mb-3">
      <label for="auteur" class="form-label">Auteur</label>
      <input type="text" class="form-control" id="auteur" name="auteur" value="{{ boek.auteur }}" required>
    </div>
    <div class="mb-3">
      <label for="kaft_foto_url" class="form-label">Kaft foto URL</label>
      <input type="text" class="form-control" id="kaft_foto_url" name="kaft_foto_url" value="{{ boek.kaft_foto_url }}">
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="is_uitgeleend" name="is_uitgeleend" {% if boek.is_uitgeleend %}checked{% endif %}>
      <label class="form-check-label" for="is_uitgeleend">Uitgeleend</label>
    </div>
    <button type="submit" class="btn btn-primary">Opslaan</button>
    <a href="{{ url_for('catalogusfrontend.boek_detail', boek_id=boek.id) }}" class="btn btn-secondary">Annuleren</a>
  </form>
</div>
</body>
</html>
