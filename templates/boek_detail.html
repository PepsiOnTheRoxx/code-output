<!DOCTYPE html>
<html>
<head>
    <title>Boek detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>{{ boek.titel }}</h1>
    <dl class="row">
        <dt class="col-sm-3">Auteur:</dt>
        <dd class="col-sm-9">{{ boek.auteur }}</dd>
        <dt class="col-sm-3">Jaar:</dt>
        <dd class="col-sm-9">{{ boek.jaar }}</dd>
        <dt class="col-sm-3">Uitgever:</dt>
        <dd class="col-sm-9">{{ boek.uitgever }}</dd>
        <dt class="col-sm-3">Uitleen status:</dt>
        <dd class="col-sm-9"><span class="badge bg-info">{{ boek.uitleen_status }}</span></dd>
    </dl>
    <a href="{{ url_for('boekaanpassenfrontend.aanpassen', boek_id=boek.id) }}" class="btn btn-warning">Aanpassen</a>
    <a href="/" class="btn btn-secondary">Terug naar overzicht</a>
</div>
</body>
</html>
