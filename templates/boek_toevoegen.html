<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boek toevoegen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
  <h1>Boek toevoegen</h1>
  <form method="post">
    <div class="mb-3">
      <label for="titel" class="form-label">Titel</label>
      <input type="text" class="form-control" id="titel" name="titel" required>
    </div>
    <div class="mb-3">
      <label for="auteur" class="form-label">Auteur</label>
      <input type="text" class="form-control" id="auteur" name="auteur" required>
    </div>
    <div class="mb-3">
      <label for="jaar" class="form-label">Jaar</label>
      <input type="number" class="form-control" id="jaar" name="jaar" min="0" required>
    </div>
    <div class="mb-3">
      <label for="isbn" class="form-label">ISBN</label>
      <input type="text" class="form-control" id="isbn" name="isbn" required>
    </div>
    <button type="submit" class="btn btn-success">Toevoegen</button>
    <a href="{{ url_for('catalogusfrontend.index') }}" class="btn btn-secondary">Terug naar catalogus</a>
  </form>
</div>
</body>
</html>
