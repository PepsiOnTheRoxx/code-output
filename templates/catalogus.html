<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogus</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
  <nav class="mb-3">
    <a href="{{ url_for('boekaanpassenfrontend.toevoegen') }}" class="btn btn-primary">Nieuw boek toevoegen</a>
  </nav>
  <h1>Boekencatalogus</h1>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Auteur</th>
        <th>ISBN</th>
        <th>Publicatiedatum</th>
        <th>Uitgeleend?</th>
        <th>Acties</th>
      </tr>
    </thead>
    <tbody>
      {% for boek in boeken %}
      <tr>
        <td>{{ boek.auteur }}</td>
        <td>{{ boek.isbn }}</td>
        <td>{{ boek.publicatiedatum }}</td>
        <td>
          {% if boek.is_uitgeleend %}
            <span class="badge bg-danger">Ja</span>
          {% else %}
            <span class="badge bg-success">Nee</span>
          {% endif %}
        </td>
        <td>
          <a href="{{ url_for('boekaanpassenfrontend.detail', boek_id=boek.id) }}" class="btn btn-sm btn-info">Details</a>
          <a href="{{ url_for('boekaanpassenfrontend.aanpassen', boek_id=boek.id) }}" class="btn btn-sm btn-warning">Aanpassen</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</body>
</html>
