<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Boek aanpassen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
  <nav class="mb-3">
    <a href="{{ url_for('catalogusfrontend.index') }}" class="btn btn-secondary">&laquo; Terug naar catalogus</a>
    <a href="{{ url_for('boekdetailfrontend.detail', boek_id=boek.id) }}" class="btn btn-outline-primary ms-2">Terug naar detail</a>
  </nav>
  <h2>Boek aanpassen</h2>
  <form method="post">
    <div class="mb-3">
      <label for="auteur" class="form-label">Auteur</label>
      <input type="text" class="form-control" id="auteur" name="auteur" required value="{{ boek.auteur }}">
    </div>
    <div class="mb-3">
      <label for="beschrijving" class="form-label">Beschrijving</label>
      <textarea class="form-control" id="beschrijving" name="beschrijving">{{ boek.beschrijving }}</textarea>
    </div>
    <div class="mb-3">
      <label for="isbn" class="form-label">ISBN</label>
      <input type="text" class="form-control" id="isbn" name="isbn" required value="{{ boek.isbn }}">
    </div>
    <div class="mb-3">
      <label for="publicatiedatum" class="form-label">Publicatiedatum</label>
      <input type="date" class="form-control" id="publicatiedatum" name="publicatiedatum" value="{{ boek.publicatiedatum }}">
    </div>
    <div class="mb-3">
      <label for="kaft_foto_url" class="form-label">Kaft foto URL</label>
      <input type="text" class="form-control" id="kaft_foto_url" name="kaft_foto_url" value="{{ boek.kaft_foto_url }}">
      {% if boek.kaft_foto_url %}
        <img src="{{ boek.kaft_foto_url }}" alt="Kaft" class="img-thumbnail mt-2" style="max-width: 150px;">
      {% endif %}
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="is_uitgeleend" name="is_uitgeleend" {% if boek.is_uitgeleend %}checked{% endif %}>
      <label for="is_uitgeleend" class="form-check-label">Uitgeleend</label>
    </div>
    <div class="mb-3">
      <label for="uitgeleend_datum" class="form-label">Uitgeleend sinds</label>
      <input type="date" class="form-control" id="uitgeleend_datum" name="uitgeleend_datum" value="{{ boek.uitgeleend_datum }}">
    </div>
    <div class="mb-3">
      <label for="uitgeleend_max_tot" class="form-label">Uitgeleend tot (max)</label>
      <input type="date" class="form-control" id="uitgeleend_max_tot" name="uitgeleend_max_tot" value="{{ boek.uitgeleend_max_tot }}">
    </div>
    <button type="submit" class="btn btn-success">Opslaan</button>
    <a href="{{ url_for('boekdetailfrontend.detail', boek_id=boek.id) }}" class="btn btn-link">Annuleren</a>
  </form>
</div>
</body>
</html>
