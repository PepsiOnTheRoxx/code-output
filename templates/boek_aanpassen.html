<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Boek bewerken</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <nav class="mb-4">
        <a href="{{ url_for('catalogusfrontend.catalogus_overzicht') }}" class="btn btn-link">&#8592; Terug naar overzicht</a>
        <a href="{{ url_for('catalogusfrontend.boek_detail', boek_id=boek.rowid) }}" class="btn btn-outline-secondary">Annuleren</a>
    </nav>
    <h1>Boek bewerken</h1>
    <form method="post">
        <div class="mb-3">
            <label class="form-label">Auteur</label>
            <input type="text" name="auteur" class="form-control" required value="{{ boek.auteur }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Kaft foto URL</label>
            <input type="url" name="kaft_foto_url" class="form-control" required value="{{ boek.kaft_foto_url }}">
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="is_uitgeleend" id="is_uitgeleend" {% if boek.is_uitgeleend %}checked{% endif %}>
            <label class="form-check-label" for="is_uitgeleend">Is uitgeleend</label>
        </div>
        <button type="submit" class="btn btn-primary">Opslaan</button>
    </form>
</div>
</body>
</html>
