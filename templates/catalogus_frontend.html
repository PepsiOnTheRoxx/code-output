<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Catalogus Overzicht</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Boekencatalogus</h1>
    <a href="{{ url_for('catalogusfrontend.boek_toevoegen_frontend') }}" class="btn btn-primary mb-3">Boek toevoegen</a>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Titel</th>
            <th>Auteur</th>
            <th>Acties</th>
        </tr>
        </thead>
        <tbody>
        {% for boek in boeken %}
            <tr>
                <td>{{ boek.titel }}</td>
                <td>{{ boek.auteur }}</td>
                <td>
                    <a href="{{ url_for('catalogusfrontend.boek_detail_frontend', boek_id=boek.id) }}" class="btn btn-info btn-sm">Detail</a>
                    <a href="{{ url_for('catalogusfrontend.boek_aanpassen_frontend', boek_id=boek.id) }}" class="btn btn-warning btn-sm">Aanpassen</a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
