<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Catalogus Overzicht</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <nav class="mb-4">
        <a href="{{ url_for('catalogusfrontend.catalogus_overzicht') }}" class="navbar-brand">Catalogus</a>
        <a href="{{ url_for('catalogusfrontend.boek_toevoegen') }}" class="btn btn-success">Boek toevoegen</a>
    </nav>
    <h1>Boekenoverzicht</h1>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Kaft</th>
                <th>Auteur</th>
                <th>Uitgeleend</th>
                <th>Acties</th>
            </tr>
        </thead>
        <tbody>
        {% for boek in boeken %}
            <tr>
                <td><img src="{{ boek.kaft_foto_url }}" alt="Kaft" style="height:60px;"></td>
                <td>{{ boek.auteur }}</td>
                <td>
                  {% if boek.is_uitgeleend %}
                    <span class="badge bg-danger">Ja</span>
                  {% else %}
                    <span class="badge bg-success">Nee</span>
                  {% endif %}
                </td>
                <td>
                    <a href="{{ url_for('catalogusfrontend.boek_detail', boek_id=boek.rowid) }}" class="btn btn-outline-primary btn-sm">Details</a>
                    <a href="{{ url_for('catalogusfrontend.boek_aanpassen', boek_id=boek.rowid) }}" class="btn btn-outline-warning btn-sm">Bewerken</a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
