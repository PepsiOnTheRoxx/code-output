<!DOCTYPE html>
<html>
<head>
    <title>Nieuw boek toevoegen</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Nieuw boek toevoegen</h1>
    <form method="post">
        <div class="mb-3">
            <label for="titel" class="form-label">Titel</label>
            <input type="text" class="form-control" id="titel" name="titel" required>
        </div>
        <div class="mb-3">
            <label for="auteur" class="form-label">Auteur</label>
            <input type="text" class="form-control" id="auteur" name="auteur" required>
        </div>
        <div class="mb-3">
            <label for="jaar" class="form-label">Jaar</label>
            <input type="number" class="form-control" id="jaar" name="jaar" min="0">
        </div>
        <div class="mb-3">
            <label for="uitgever" class="form-label">Uitgever</label>
            <input type="text" class="form-control" id="uitgever" name="uitgever">
        </div>
        <div class="mb-3">
            <label for="kaft_foto_url" class="form-label">Kaft foto URL</label>
            <input type="url" class="form-control" id="kaft_foto_url" name="kaft_foto_url">
        </div>
        <button type="submit" class="btn btn-success">Toevoegen</button>
        <a href="{{ url_for('boektoevoegenfrontend.catalogus') }}" class="btn btn-secondary ms-2">Annuleren</a>
    </form>
</div>
</body>
</html>
