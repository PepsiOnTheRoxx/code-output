<!DOCTYPE html>
<html>
<head>
    <title>Catalogus</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <nav class="navbar navbar-light mb-3">
        <a class="navbar-brand h1" href="{{ url_for('catalogusfrontend.index') }}">Bibliotheek Catalogus</a>
        <a href="{{ url_for('catalogusfrontend.toevoegen') }}" class="btn btn-primary">Boek toevoegen</a>
    </nav>
    <div class="row">
    {% for boek in boeken %}
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <img src="{{ boek.kaft_url }}" class="card-img-top" alt="Kaft van {{ boek.titel }}" style="height: 300px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title">{{ boek.titel }}</h5>
                    <p class="card-text">Auteur: {{ boek.auteur }}</p>
                    <p><span class="badge bg-{{ 'success' if boek.status == 'Beschikbaar' else 'danger' }}">{{ boek.status }}</span></p>
                    <a href="{{ url_for('catalogusfrontend.detail', boek_id=boek.id) }}" class="btn btn-info btn-sm">Detail</a>
                    <a href="{{ url_for('catalogusfrontend.aanpassen', boek_id=boek.id) }}" class="btn btn-warning btn-sm">Aanpassen</a>
                </div>
            </div>
        </div>
    {% endfor %}
    </div>
</div>
</body>
</html>
